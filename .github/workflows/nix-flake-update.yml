name: NixOS Flake Updater
# Purpose:
#   Automatically updates flake.lock with latest input versions on a weekly schedule.
#   Opens a PR; test-nixos-config.yml tests it (flake check + dry-run of every host).
#
# Triggers:
#   - Weekly: Mondays at 2 AM EST (7 AM UTC)
#   - Manual: workflow_dispatch for on-demand updates
#
# Workflow:
#   1. Close any old open flake update PRs from previous runs
#   2. Delete branches left behind by any closed/merged PR repo-wide (not just flake updates)
#   3. Update flake.lock with latest versions
#   4. Create timestamped branch with changes
#   5. Open a PR; its CI (test-nixos-config.yml) does all testing
#
# Required Secrets:
#   - GITHUB_TOKEN: For branch push and cleanup (automatically provided)
#   - GH_PAT: Opens the PR as the repo owner so its CI runs without approval
#     (needs Pull requests: write; also used by rotate-headscale-key.yml)
#   - MATRIX_HOMESERVER_URL: Matrix notification server
#   - MATRIX_ROOM_ID: Matrix room for notifications
#   - MATRIX_ACCESS_TOKEN: Matrix authentication token

on:
  # Run weekly on Mondays at 2 AM EST (7 AM UTC)
  schedule:
    - cron: '0 7 * * 1'
  # Allow manual trigger
  workflow_dispatch:

env:
  MATRIX_HOMESERVER_URL: ${{ secrets.MATRIX_HOMESERVER_URL }}
  MATRIX_ROOM_ID: ${{ secrets.MATRIX_ROOM_ID }}
  MATRIX_ACCESS_TOKEN: ${{ secrets.MATRIX_ACCESS_TOKEN }}

jobs:
  # Close any old open PRs from previous runs
  close-old-prs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Close superseded PRs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Find all open PRs with head branches matching the pattern
        OLD_PRS=$(gh pr list \
          --state open \
          --json number,headRefName \
          --jq '.[] | select(.headRefName | startswith("nix-flake-update-")) | "\(.number) \(.headRefName)"')

        if [ -z "$OLD_PRS" ]; then
          echo "No old flake update PRs to close"
          exit 0
        fi

        # Close each old PR with explanation; branch deletion is handled by the
        # cleanup-stale-branches job below, which sweeps all closed PR branches
        echo "$OLD_PRS" | while read -r PR_NUMBER BRANCH_NAME; do
          if [ -n "$PR_NUMBER" ]; then
            echo "Closing PR #$PR_NUMBER"
            gh pr close "$PR_NUMBER" \
              --comment "This flake update PR has been superseded by a new automated run. Closing to avoid clutter."
          fi
        done

  # Delete branches left behind by any closed or merged PR across the whole repo.
  # Catches branches GitHub's "auto-delete head branches" setting misses (e.g. PRs
  # closed without merging) and branches from old workflow runs before this job existed.
  cleanup-stale-branches:
    runs-on: ubuntu-latest
    needs: close-old-prs
    permissions:
      contents: write
      pull-requests: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Delete branches from closed/merged PRs
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        DEFAULT_BRANCH=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')

        if [ -z "$DEFAULT_BRANCH" ]; then
          echo "::error::Could not resolve default branch, aborting to avoid deleting the wrong ref"
          exit 1
        fi

        # Never touch a branch that still has an open PR pointing at it
        OPEN_BRANCHES=$(gh pr list --state open --json headRefName --limit 300 --jq '.[].headRefName' | sort -u)

        # Every branch behind a closed (merged or rejected) PR is a cleanup candidate.
        # A branch can have had multiple PRs over time, so dedupe after listing.
        CLOSED_BRANCHES=$(gh pr list --state closed --json headRefName --limit 300 --jq '.[].headRefName' | sort -u)

        if [ -z "$CLOSED_BRANCHES" ]; then
          echo "No closed PR branches to check"
          exit 0
        fi

        echo "$CLOSED_BRANCHES" | while read -r BRANCH_NAME; do
          [ -z "$BRANCH_NAME" ] && continue
          [ "$BRANCH_NAME" = "$DEFAULT_BRANCH" ] && continue

          if echo "$OPEN_BRANCHES" | grep -qx "$BRANCH_NAME"; then
            echo "Skipping $BRANCH_NAME (still has an open PR)"
            continue
          fi

          if ! gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH_NAME}" >/dev/null 2>&1; then
            echo "Branch $BRANCH_NAME already gone"
            continue
          fi

          echo "Deleting stale branch $BRANCH_NAME"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH_NAME}" || \
            echo "Failed to delete $BRANCH_NAME (may be protected), skipping"
        done

  # Update flake.lock
  update-flake:
    runs-on: ubuntu-latest
    needs: close-old-prs
    outputs:
      update_available: ${{ steps.update-flake.outputs.update_available }}
      parent_event_id: ${{ steps.notify-start.outputs.event_id }}
      branch_name: ${{ steps.create-branch.outputs.branch_name }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Notify start
      id: notify-start
      continue-on-error: true
      uses: ./.github/actions/matrix-notification
      with:
        message: |
          🔄 Running Nix Flake Update
          Workflow: Nix Flake Update
          Branch: ${{ github.ref_name }}
        room_id: ${{ secrets.MATRIX_ROOM_ID }}
        homeserver_url: ${{ secrets.MATRIX_HOMESERVER_URL }}
        access_token: ${{ secrets.MATRIX_ACCESS_TOKEN }}

    - name: Install Nix
      uses: cachix/install-nix-action@v27
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Update flake inputs
      id: update-flake
      run: |
        echo "Running nix flake update..."
        nix flake update

        # Check if flake.lock changed
        if git diff --quiet flake.lock; then
          echo "No updates available"
          echo "update_available=false" >> $GITHUB_OUTPUT
        else
          echo "Updates available"
          echo "update_available=true" >> $GITHUB_OUTPUT

          # Get summary of changes
          echo "Changes in flake.lock:"
          git diff flake.lock | head -n 50
        fi

    - name: Notify no updates
      if: steps.update-flake.outputs.update_available == 'false'
      continue-on-error: true
      uses: ./.github/actions/matrix-notification
      with:
        message: |
          ℹ️ No flake updates available
        room_id: ${{ secrets.MATRIX_ROOM_ID }}
        homeserver_url: ${{ secrets.MATRIX_HOMESERVER_URL }}
        access_token: ${{ secrets.MATRIX_ACCESS_TOKEN }}
        thread_id: ${{ steps.notify-start.outputs.event_id }}

    - name: Skip if no updates
      if: steps.update-flake.outputs.update_available == 'false'
      run: |
        echo "No updates available, skipping tests"
        exit 0

    - name: Create update branch
      id: create-branch
      if: steps.update-flake.outputs.update_available == 'true'
      run: |
        SHORT_SHA=$(git rev-parse --short HEAD)
        BRANCH_NAME="nix-flake-update-$(date +%Y%m%d-%H%M%S)-${SHORT_SHA}"
        echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -b "$BRANCH_NAME"
        git add flake.lock
        git commit -m "chore: update flake inputs"
        
        # Push and verify success
        if ! git push origin "$BRANCH_NAME"; then
          echo "Failed to push branch"
          exit 1
        fi
        echo "Successfully pushed branch $BRANCH_NAME"

  # Open the PR; test-nixos-config.yml runs on it
  create-pr:
    runs-on: ubuntu-latest
    needs: update-flake
    if: needs.update-flake.outputs.update_available == 'true'
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.update-flake.outputs.branch_name }}

    - name: Create Pull Request
      id: create-pr
      env:
        # PAT, not GITHUB_TOKEN: GitHub holds pull_request runs on PRs opened by
        # github-actions[bot] for manual approval. Opening the PR as the repo
        # owner lets the test workflow run on its own.
        GH_TOKEN: ${{ secrets.GH_PAT }}
      run: |
        BODY=$(cat <<'MD'
        Automated flake.lock update.

        The Test NixOS Flake Configuration checks on this PR run `nix flake check` and a dry-run of every NixOS host. Merge once they pass; the deploy workflow runs on merge.
        MD
        )

        PR_URL=$(gh pr create \
          --title "chore: update flake inputs" \
          --body "$BODY" \
          --base main \
          --head "${{ needs.update-flake.outputs.branch_name }}")
        
        echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
        echo "Created PR: $PR_URL"

    - name: Notify PR created
      continue-on-error: true
      uses: ./.github/actions/matrix-notification
      with:
        message: |
          ✅ Pull request created for flake update
          ${{ steps.create-pr.outputs.pr_url }}
        room_id: ${{ secrets.MATRIX_ROOM_ID }}
        homeserver_url: ${{ secrets.MATRIX_HOMESERVER_URL }}
        access_token: ${{ secrets.MATRIX_ACCESS_TOKEN }}
        thread_id: ${{ needs.update-flake.outputs.parent_event_id }}
